services:

#  # ========================
#  # MQTT
#  # ========================
  mosquitto-broker:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2.1.2-alpine
    # No host port binding -- benchmark runs inside the internal mqtt-net.
    networks:
      - mqtt-net
    volumes:
      # MOSQUITTO_CONF=mosquitto-tls.conf (set by runner.py --tls) serves MQTT over TLS on 8883.
      - ./protocols/MQTT/mosquitto-broker/${MOSQUITTO_CONF:-mosquitto.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro

  # Sender = the server/CI side publishing the model. It sits in a good
  # network, so it is NOT shaped (NETWORK_PROFILE=none); only the broker <->
  # device (client-b) link is constrained. It stays idle so the test harness
  # can drive one transfer at a time (per file / QoS) with per-run pcap capture.
  mqtt-client-a:
    profiles: ["mqtt"]
    build: ./
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - mosquitto-broker
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - mqtt-net
    environment:
      - NETWORK_PROFILE=none
      - TLS=${TLS:-0}

  # Receiver = the edge device. Shapes its own egress (device -> broker).
  mqtt-client-b:
    profiles: ["mqtt"]
    build: ./
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - mosquitto-broker
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - mqtt-net
    environment:
      - APP_COMMAND=python -m protocols.MQTT.clients.client_b
      - NETWORK_PROFILE=${NETWORK_PROFILE}
      - TLS=${TLS:-0}

  # Shares the broker's network namespace. It captures the pcaps AND shapes
  # the broker's egress towards client-b only (SHAPE_DST), i.e. the broker ->
  # device direction of the constrained link -- don't remove it.
  mqtt-capture:
    profiles: ["mqtt"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - mosquitto-broker
      - mqtt-client-b
    network_mode: "service:mosquitto-broker"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: [ "sh", "/app/scripts/network_chaos.sh" ]
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}
      - SHAPE_DST=mqtt-client-b

  # ========================
  # HTTP
  # ========================
  http-server:
    profiles: ["http", "http-get"]
    build: .
    cap_add:
      - NET_ADMIN                          # needed for tc on server too
    command: [ "/app/scripts/network_chaos.sh" ]
    volumes:
      - ./uploads:/var/www/uploads/upload
      - ./output:/app/output
      - ./:/app
    networks:
      - http-net
    environment:
      - APP_COMMAND=python -m protocols.HTTP.server.flask_server
      - NETWORK_PROFILE=${NETWORK_PROFILE}
      - TLS=${TLS:-0}

  # Client -- tc applied at startup, then stays idle (see mqtt-client-a).
  http-client:
    profiles: ["http", "http-get"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - http-server
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - http-net
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}
      - TLS=${TLS:-0}

  http-capture:
    profiles: ["http", "http-get"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - http-server
    network_mode: "service:http-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: [ "sleep", "infinity" ]

#  # ========================
#  # CoAP
#  # ========================
  coap-server:
    profiles: ["coap"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - coap-net
    environment:
      - APP_COMMAND=python -m protocols.CoAP.server.coap_server
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  # Client -- tc applied at startup, then stays idle (see mqtt-client-a).
  coap-client:
    profiles: ["coap"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - coap-server
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - coap-net
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  coap-capture:
    profiles: ["coap"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - coap-server
    network_mode: "service:coap-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: [ "sleep", "infinity" ]

  # ========================
  # AMQP
  # ========================
  rabbitmq-broker:
    profiles: ["amqp"]
    image: rabbitmq:3.13.7-alpine
    networks:
      - amqp-net

  # Sender = server/CI side in a good network: not shaped (see mqtt-client-a).
  amqp-client-a:
    profiles: ["amqp"]
    build: ./
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - rabbitmq-broker
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - amqp-net
    environment:
      - NETWORK_PROFILE=none

  # Receiver -- stays up and waits for published chunks from client A.
  amqp-client-b:
    profiles: ["amqp"]
    build: ./
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - rabbitmq-broker
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - amqp-net
    environment:
      - APP_COMMAND=python -m protocols.AMQP.receiver.amqp_receiver
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  # Captures AND shapes broker -> amqp-client-b (see mqtt-capture) -- don't remove.
  amqp-capture:
    profiles: ["amqp"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - rabbitmq-broker
      - amqp-client-b
    network_mode: "service:rabbitmq-broker"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: [ "sh", "/app/scripts/network_chaos.sh" ]
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}
      - SHAPE_DST=amqp-client-b

  # ========================
  # gRPC
  # ========================
  grpc-server:
    profiles: ["grpc"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - grpc-net
    environment:
      - APP_COMMAND=python -m protocols.GRPC.server.grpc_server
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  # Client -- tc applied at startup, then stays idle (see mqtt-client-a).
  grpc-client:
    profiles: ["grpc"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - grpc-server
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - grpc-net
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  grpc-capture:
    profiles: ["grpc"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - grpc-server
    network_mode: "service:grpc-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: [ "sleep", "infinity" ]

  # ========================
  # LwM2M (CoAP-based emulator)
  # ========================
  lwm2m-server:
    profiles: ["lwm2m"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    volumes:
      - ./output:/app/output
      - ./:/app
    networks:
      - lwm2m-net
    environment:
      - APP_COMMAND=python -m protocols.LWM2M.server.lwm2m_server
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  # Client -- tc applied at startup, then stays idle (see mqtt-client-a).
  lwm2m-client:
    profiles: ["lwm2m"]
    build: .
    cap_add:
      - NET_ADMIN
    command: [ "/app/scripts/network_chaos.sh" ]
    depends_on:
      - lwm2m-server
    volumes:
      - ./output:/app/output
      - ./:/app
      - ./data:/app/data
    networks:
      - lwm2m-net
    environment:
      - NETWORK_PROFILE=${NETWORK_PROFILE}

  lwm2m-capture:
    profiles: ["lwm2m"]
    image: nicolaka/netshoot:v0.16
    depends_on:
      - lwm2m-server
    network_mode: "service:lwm2m-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: [ "sleep", "infinity" ]

networks:
  mqtt-net:
    driver: bridge
  coap-net:
    driver: bridge
  http-net:
    driver: bridge
  amqp-net:
    driver: bridge
  grpc-net:
    driver: bridge
  lwm2m-net:
    driver: bridge