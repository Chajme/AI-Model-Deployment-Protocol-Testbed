# Testbed overrides for RabbitMQ (mounted into /etc/rabbitmq/conf.d/).
#
# Under the v2 shaping model the broker -> device link is constrained (down to
# ~25 kbit/s on nbiot). RabbitMQ closes a client connection when one socket
# write blocks longer than send_timeout (default 15 s); writing a 1 MB message
# to a slow consumer takes far longer, so the receiver's connection was reset
# mid-transfer. Allow 10 minutes per write.
tcp_listen_options.send_timeout = 600000

# Heartbeat frames queue behind large messages on a slow link (1 MB at
# 25 kbit/s is ~5.5 min), so use a heartbeat longer than one message.
heartbeat = 600
